org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No AndroidX, and no Compose. The page is a monospace grid, a caret and a
# status line drawn on a Canvas; a UI framework would be most of the APK and
# would buy nothing. Same argument CLAUDE.md makes for rejecting bubbletea.
android.useAndroidX=false
kotlin.code.style=official
